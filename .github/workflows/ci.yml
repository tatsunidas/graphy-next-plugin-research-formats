# push・PR ごとに JUnit を回す（合成の NIfTI。実データはリポジトリに入れないので、その検査は飛ぶ）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GRAPHY_VERSION: "0.6.3"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install graphy-plugin-api into local repository
        run: |
          gh release download "v${GRAPHY_VERSION}" --repo tatsunidas/GRAPHY-Next --pattern "graphy-plugin-api-*.jar" --dir /tmp/api
          jar=$(ls /tmp/api/graphy-plugin-api-*.jar | head -n1)
          mvn -B -q install:install-file -Dfile="$jar" -DgroupId=com.vis.graphynext -DartifactId=graphy-plugin-api \
            -Dversion="${GRAPHY_VERSION}" -Dpackaging=jar
      - name: Test and package
        run: mvn -B -f backend/pom.xml -Dgraphy.version="${GRAPHY_VERSION}" package
